services:

  gateway_service:
    build:
      context: ./gateway_service
      dockerfile: Dockerfile
    image: gateway_service:latest
    container_name: gateway_service
    restart: unless-stopped
    environment:
      - ACCOUNT_SERVICE_URL=http://account_service:8001
      - ORDER_SERVICE_URL=http://order_service:8002
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      account_service:
        condition: service_started
      order_service:
        condition: service_started
    networks:
      - app-network

  account_service:
    build:
      context: ./account_service
      dockerfile: Dockerfile
    image: account_service:latest
    container_name: account_service
    restart: unless-stopped
    env_file:
      - .env.db
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - app-network
  
  order_service:
    build:
      context: ./order_service
      dockerfile: Dockerfile
    image: order_service:latest
    container_name: order_service
    restart: unless-stopped
    env_file:
      - .env.db
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - app-network
  
  postgres_db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env.db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      app-network:
        aliases:
          - db
    healthcheck:                                    
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  
#ОТЛАДКА БАЗЫ ДАННЫХ
  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: