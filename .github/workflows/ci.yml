name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff Linter
        run: ruff check .
      - name: Run Ruff Formatter Check
        run: ruff format --check .

  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r gateway_service/requirements.txt
          pip install -r account_service/requirements.txt
          pip install -r order_service/requirements.txt
      - name: Run Pytest
        env:
          DB_URL: postgresql+asyncpg://postgres:password@localhost:5432/postgres
          TOKEN: "123456789:ABCdefGHIjklMNOpqrSTUvwxYZ"
          ADMINS: "2112582980"
          ACCOUNT_SERVICE_URL: "http://account_service:8001"
          ORDER_SERVICE_URL: "http://order_service:8002"
          REDIS_URL: "redis://localhost:6379/0"
          TESTING: "1"
        run: pytest -v
